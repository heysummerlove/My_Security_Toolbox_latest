		<script language="javascript">
	        Array.prototype.remove = function(val) {
				this.splice(jQuery.inArray(val,this),1);
	        };
			var timer;
			var extned_ids = [];
			var toggle_flag = '';
			function a() {
				var id = '38';
				//console.log(id);
				var csrfmiddlewaretoken = 'W9eCvYuLUvw6f0hXpKZBdZ9V0Vvx28ma'
				var data = [];
				var id_obj = toJsionObj('id',id);
				var csrfmiddlewaretoken_obj = toJsionObj('csrfmiddlewaretoken',csrfmiddlewaretoken);
				data.push(id_obj);
				data.push(csrfmiddlewaretoken_obj);
				jQuery.ajax({
							type:'POST',
							url:'/list/process/',
							data:data,
							success:function(msg){
								//_CbFunc(msg);
								jQuery('#processWithLatest50').html(msg);
								timer = setTimeout('a()', 2000);
							}
						})
			}
			
			function _CbFunc(msg) {
				if (msg == "done") {
					clearTimeout(timer);
					alert('已完成');
				} else {
					jQuery('#processWithLatest50').html(msg);
					extend_tr(extned_ids);
				}
			}
			function clear_time(){
				if (timer){
					clearTimeout(timer);
				};
			}
			function toJsionObj(name,data)
			{
				var j_str =  '{ "name":"'+name+'", "value":"'+data+'"}';
				var j_obj = eval('(' + j_str + ')');
				return j_obj
			}
			function more_toggle(o, id, same_bg){
				var tr_more = jQuery('#' + id)[0];
				var tr_class = (o.className != "" && same_bg) ? (" " + o.className) : "";
				
				if (jQuery('#' + id).hasClass("hide")) {
					jQuery(o).find('img.plus').attr('class', 'ico minus')
					jQuery(tr_more).removeClass('hide');
					extned_ids.push({target:jQuery(o).attr("id"),id:id});
				}
				else {
					jQuery(o).find('img.minus').attr('class', 'ico plus')
					jQuery(tr_more).addClass('hide');
					extned_ids.remove({target:jQuery(o).attr("id"),id:id});
				};
			}
			function extend_tr(extned_ids){
				jQuery(extned_ids).each(function(index,e){
					jQuery(jQuery('#' + e.target)).find('img.plus').attr('class', 'ico minus')
					jQuery(jQuery('#' + e.id)).removeClass('hide');					
				})
			}
			function arrow_toggle(obj){
				if (toggle_flag.length>1){
					jQuery(obj).attr('class','title');
					jQuery(obj.parentNode).next().show();
					toggle_flag='';
				}else{
					jQuery(obj).attr('class','title off');
					jQuery(obj.parentNode).next().hide();
					toggle_flag='off';
				};
			}
			
			
			function stopTask(id)
			{
				location.href = '/list/proStopTask/id/'+id+'/';
			}
			function pauseTask(id)
			{
				location.href = '/list/proPauseTask/id/'+id+'/';
			}
			function goBack()
			{
				location.href = '/list/';
			}
			function toJsionObj(name,data)
			{
				var j_str =  '{ "name":"'+name+'", "value":"'+data+'"}';
				var j_obj = eval('(' + j_str + ')');
				return j_obj
			}
			jQuery(function() {
			    a();
			})
