if (top != self) top.location.replace('/accounts/login/');
	function antohide() {
		var username = UI.G('username'),password = UI.G('password');
		//Kill Bug
		if (username.value!='') {
			UI.addClass(UI.prev(username),'hide');
		}else {
			UI.removeClass(UI.prev(username),'hide');
			username.blur();
		}
		if(password.value == ''){
			UI.removeClass(UI.prev(password),'hide');
		}else{
			UI.addClass(UI.prev(password),'hide');
			password.blur();
		}
	}

	function onloadTextBox() {
		antohide();
		//Add Event
		var username = UI.G('username'),password = UI.G('password');

		password.onblur =  username.onblur = function(){antohide();}
		password.onfocus = username.onfocus = function(){UI.addClass(UI.prev(this),'hide');}

		//username.focus();
		//Kill Scroll
		document.documentElement.style.overflow = 'hidden';
		
		
	}
	
	function switchOn(obj,imgId){
		UI.addClass(obj,'on');
		UI.G(imgId).src='/media/stylesheet/nsfocus_2012/images/login/login_tip.gif';	
	}
	
	function switchOff(obj,imgId){
		UI.removeClass(obj,'on');
			UI.G(imgId).src='/media/stylesheet/nsfocus_2012/images/login/login_tip_2.gif';
	}
	function login() {
		//$('loginForm').submit();
		//UI.addClass(UI.G('filedset'),'error');
	}
	
	
	function keypress(e) {
		var keynum
		if(window.event) { //IE
			keynum = window.event.keyCode
		} else if(e.which) {// Netscape/Firefox/Opera 
			keynum = e.which
		}
		if (keynum == 13) {
			login();
			Event.stop(e); //Stop Chrome's event buubbl.
		}
	}
	function user_info(){
		
		top.dialog.show({title:"用户许可协议",url:'/media/LicenseAgreement_zh_CN.html',size:'medium',height:280,resize:false});
	}
	UI.EA(window, 'load', onloadTextBox);
	var dialog = new UI.Dialog({name:'dialog'});
</script>

   function submitForm(){
